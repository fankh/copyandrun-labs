name: cr-sigma
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cr-sigma-es
    mem_limit: 2g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19500:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
  kb:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: cr-sigma-kb
    mem_limit: 2g
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      # 규칙(알림)을 저장하려면 암호화 키가 있어야 합니다. 이 값은 실습용 고정 키입니다.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=0123456789abcdef0123456789abcdef
    ports:
      - "127.0.0.1:19501:5601"
    depends_on:
      - es
volumes:
  esdata:
    name: cr-sigma-esdata
networks:
  default:
    name: cr-sigma-net
