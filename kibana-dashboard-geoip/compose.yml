name: cr-kibana
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cr-kibana-es
    mem_limit: 2g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:19600:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
  kb:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: cr-kibana-kb
    mem_limit: 2g
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "127.0.0.1:19601:5601"
    depends_on:
      - es
volumes:
  esdata:
    name: cr-kibana-esdata
networks:
  default:
    name: cr-kibana-net
