input { stdin { } }

filter {
  grok {
    pattern_definitions => {
      "NGINX_ACCESS" => '%{IPORHOST:[source][address]} - %{DATA:[user][name]} \[%{HTTPDATE:log_time}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"'
    }
    match => { "message" => "%{NGINX_ACCESS}" }
  }
  date {
    match => [ "log_time", "dd/MMM/yyyy:HH:mm:ss Z" ]
    remove_field => [ "log_time" ]
  }
}

output {
  stdout { codec => rubydebug }
}
