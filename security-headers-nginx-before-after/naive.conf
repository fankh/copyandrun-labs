server {
  listen 443 ssl;
  ssl_certificate     /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  server_tokens off;
  # always 없이 server 수준에만 둔 헤더: 오류 응답에는 붙지 않고, 자체 add_header 가 있는 location 에는 상속되지 않는다
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";
  location / {
    default_type text/html;
    return 200 "<h1>hello</h1>";
  }
  location = /login {
    add_header Set-Cookie "sid=abc123; Path=/; HttpOnly; Secure; SameSite=Lax";
    default_type text/html;
    return 200 "<h1>login</h1>";
  }
  location /api/ {
    add_header Cache-Control "no-store";
    default_type application/json;
    return 200 "{\"ok\":true}";
  }
  location = /missing {
    return 404 "not found";
  }
}
