name: cr-pii
services:
  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: cr-pii-opensearch
    mem_limit: 1g
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true # 실습 전용: 인증과 TLS를 끕니다
      - http.compression=false
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:5790:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.2.0
    container_name: cr-pii-dashboards
    mem_limit: 1g
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true # 실습 전용: 로그인 화면을 끕니다
    ports: ["127.0.0.1:5791:5601"]
    depends_on: [opensearch]
  llm:
    image: python:3.12-slim
    container_name: cr-pii-llm
    command: sh -c "pip install -q flask==3.1.3 && python /app/mock_llm.py"
    volumes: ["./mock_llm.py:/app/mock_llm.py:ro"]
    ports: ["127.0.0.1:5793:8000"]
  app:
    image: python:3.12-slim
    container_name: cr-pii-app
    command: sh -c "pip install -q flask==3.1.3 && cd /app && python app.py"
    environment:
      - MASK=${MASK:-0} # 1 이면 로그와 프롬프트에서 개인정보를 가립니다
    volumes:
      - ./app.py:/app/app.py:ro
      - ./pii.py:/app/pii.py:ro
      - ./logs:/logs
    ports: ["127.0.0.1:5792:8000"]
    depends_on: [llm]
volumes:
  opensearch-data:
