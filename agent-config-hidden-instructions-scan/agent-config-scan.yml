# .github/workflows/agent-config-scan.yml 로 저장합니다. 스캐너는 저장소 루트의 tools 폴더에 둡니다.
name: agent-config-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 규칙 파일 검사
        run: python tools/agent_config_scan.py . --html scan-report.html
      - name: 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan-report.html
