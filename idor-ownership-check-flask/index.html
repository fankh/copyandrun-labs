<!doctype html>
<meta charset="utf-8">
<title>주문 조회 연습</title>
<style>
  body { font: 15px sans-serif; max-width: 680px; margin: 24px auto; }
  .row { margin: 10px 0; }
  input, select, button { padding: 6px 10px; font-size: 15px; }
  input { width: 90px; }
  pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; word-break: break-all; }
</style>
<h2>주문 조회 연습</h2>
<div class="row">
  사용자
  <select id="user"><option>alice</option><option>carol</option><option>admin</option></select>
  <button id="login">로그인</button>
  <span id="who">로그인 안 됨</span>
</div>
<div class="row">
  주문 번호 <input id="oid" type="number" value="1">
  <button data-m="GET">조회</button>
  <button data-m="PATCH">수정</button>
  <button data-m="DELETE">삭제</button>
  <button id="list">목록</button>
</div>
<pre id="out">결과가 여기에 표시됩니다.</pre>
<script>
  const out = document.getElementById("out");

  async function call(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    out.textContent = method + " " + path + " -> " + res.status + "\n" + await res.text();
    return res;
  }

  document.getElementById("login").onclick = async () => {
    const user = document.getElementById("user").value;
    const res = await call("POST", "/login", { username: user, password: user + "-pw" });
    document.getElementById("who").textContent = res.ok ? user + " 로그인됨" : "로그인 실패";
  };

  document.querySelectorAll("button[data-m]").forEach((b) => {
    b.onclick = () => call(b.dataset.m, "/orders/" + document.getElementById("oid").value,
                           b.dataset.m === "PATCH" ? { item: "수정한 상품" } : undefined);
  });

  document.getElementById("list").onclick = () => call("GET", "/orders");
</script>
