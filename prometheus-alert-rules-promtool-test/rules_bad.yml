groups:
  - name: lab
    rules:
      - alert: InstanceDown
        expr: up == 1
        labels:
          severity: critcal
        annotations:
          summary: "{{ $labels.instance }} 가 2분 넘게 응답하지 않습니다"
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx 비율이 5%를 넘었습니다"
