log_format lab '$remote_addr [$time_iso8601] "$request" $status "$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" host="$host"';

server {
    listen 80;
    access_log /var/log/nginx/lab_access.log lab;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
