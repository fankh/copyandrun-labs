# --- mid.example.test: 단계적 적용 (quarantine 50%, 하위 도메인 reject) ---
txt-record=mid.example.test,"v=spf1 include:_spf.mail.example.test ~all"
txt-record=_dmarc.mid.example.test,"v=DMARC1; p=quarantine; sp=reject; pct=50; aspf=s; rua=mailto:dmarc-reports@mid.example.test"

