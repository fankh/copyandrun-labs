# 시험용 DNS 설정입니다. example.test 영역의 응답만 만들고 바깥으로는 묻지 않습니다.
port=53
bind-interfaces
listen-address=0.0.0.0
no-resolv
no-hosts
no-poll
local=/example.test/
log-queries
log-facility=-

# --- good.example.test: 정상 기록 (SPF include + ip4 + -all, DKIM 2048비트, DMARC reject) ---
txt-record=good.example.test,"v=spf1 ip4:10.20.0.0/24 include:_spf.mail.example.test -all"
txt-record=_spf.mail.example.test,"v=spf1 ip4:192.168.50.0/24 -all"
txt-record=s2026._domainkey.good.example.test,"v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmKfEYCdw5t8EOPbvEhUrHSpLKAu1L7a2nyFjJDArHL1SLYGZ6ZIWSpiolMGD/GxH9qOGAb/r8KM5+D7kkV6ri24LDLgNXpnI5Ety+D5J+NQbbvjInADSu759mXCeMUCYj1rq9ZH2QUpAWEk8VjyPwb0SWMqO","Upj1xfb5q5afMAAk9w8S0PajjU9yfCBDnWFiZKj0lTP5Z1DCUjsbw6kYR/GFWy7FunQ1zODHhPCTmx5QPRLAb+rNbIgBmHw8FhwxfbZRzyi+RlhlSgQl9GoILI2HNJE9wq9TTCOcfdB1dp2ddvdcec5jHvRsdMsWFIwsVIBFW9dVy3NtOtoeRYoYBQIDAQAB"
txt-record=_dmarc.good.example.test,"v=DMARC1; p=reject; rua=mailto:dmarc-reports@good.example.test; adkim=s; aspf=s; pct=100"

# --- loose.example.test: 느슨한 기록 (mx, a 사용, ~all, DKIM 테스트 중, DMARC none) ---
host-record=loose.example.test,10.20.0.30
host-record=mail.loose.example.test,10.20.0.25
mx-host=loose.example.test,mail.loose.example.test,10
txt-record=loose.example.test,"v=spf1 mx a ip4:10.20.0.0/24 ~all"
txt-record=s2026._domainkey.loose.example.test,"v=DKIM1; k=rsa; t=y; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmKfEYCdw5t8EOPbvEhUrHSpLKAu1L7a2nyFjJDArHL1SLYGZ6ZIWSpiolMGD/GxH9qOGAb/r8KM5+D7kkV6ri24LDLgNXpnI5Ety+D5J+NQbbvjInADSu759mXCeMUCYj1rq9ZH2QUpAWEk8VjyPwb0SWMqO","Upj1xfb5q5afMAAk9w8S0PajjU9yfCBDnWFiZKj0lTP5Z1DCUjsbw6kYR/GFWy7FunQ1zODHhPCTmx5QPRLAb+rNbIgBmHw8FhwxfbZRzyi+RlhlSgQl9GoILI2HNJE9wq9TTCOcfdB1dp2ddvdcec5jHvRsdMsWFIwsVIBFW9dVy3NtOtoeRYoYBQIDAQAB"
