rules:
  - id: company-sql-string-built
    languages: [python]
    severity: ERROR
    message: SQL 문자열을 f-string, 문자열 더하기, format 으로 만들지 말고 ? 자리표시자로 값을 넘깁니다.
    pattern-either:
      - pattern: $DB.execute(f"...")
      - pattern: $DB.execute("..." + $X)
      - pattern: $DB.execute("...".format(...))

  - id: company-tls-verify-false
    languages: [python]
    severity: ERROR
    message: 인증서 검증을 끄지 않습니다. verify=False 를 제거합니다.
    pattern: requests.$FUNC(..., verify=False, ...)

  - id: company-weak-password-hash
    languages: [python]
    severity: WARNING
    message: 비밀번호에 md5 나 sha1 을 쓰지 않습니다. scrypt, bcrypt, argon2 를 씁니다.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: company-os-command-taint
    languages: [python]
    severity: ERROR
    mode: taint
    message: 요청에서 받은 값이 셸 명령으로 흘러갑니다. 목록 인자로 실행하거나 shlex.quote 를 거칩니다.
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - pattern: os.system(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)

  - id: company-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: shell=True 로 실행하지 않습니다. 명령을 목록으로 나눠 넘깁니다.
    pattern: subprocess.$F(..., shell=True, ...)

  - id: company-no-run-shell
    languages: [python]
    severity: ERROR
    message: 우리 팀은 run_shell 대신 safe_run 을 씁니다.
    pattern: run_shell(...)
