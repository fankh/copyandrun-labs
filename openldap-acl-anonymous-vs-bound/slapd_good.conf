# ACL 을 좁힌 slapd 설정(시험용)
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
pidfile /tmp/slapd.pid
modulepath /usr/lib/openldap
moduleload back_mdb.so
database mdb
suffix "dc=lab,dc=test"
rootdn "cn=admin,dc=lab,dc=test"
rootpw @@ROOTPW@@
directory /var/lib/openldap/data
# 비밀번호는 로그인 확인에만 쓰이고, 본인만 바꿀 수 있으며, 그 밖에는 아무도 읽지 못한다
access to attrs=userPassword
    by dn.exact="cn=admin,dc=lab,dc=test" manage
    by self write
    by anonymous auth
    by * none
# 본인의 설명(description)은 본인만 고치고, 로그인한 사용자는 읽기만 한다
access to attrs=description
    by dn.exact="cn=admin,dc=lab,dc=test" manage
    by self write
    by users read
    by * none
# 나머지는 로그인한 사용자만 읽고, 익명은 아무것도 못 본다
access to *
    by dn.exact="cn=admin,dc=lab,dc=test" manage
    by users read
    by * none
