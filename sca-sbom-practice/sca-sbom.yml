name: sca-sbom
on: [pull_request]
jobs:
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit cyclonedx-bom
          pip-audit -r requirements.txt
      - name: SBOM 생성
        run: cyclonedx-py requirements requirements.txt -o sbom.json --output-format JSON
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
