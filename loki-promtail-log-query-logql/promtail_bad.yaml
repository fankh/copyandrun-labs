server:
  disable: true
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://osk-lbc-loki-bad:3100/loki/api/v1/push
scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) \S+ \S+ \[[^\]]+\] "(?P<method>\S+) (?P<uri>\S+) [^"]*" (?P<status>\d+)'
      - labels:
          ip:
          uri:
          status:
