# sshd hardening. Install it as /etc/ssh/sshd_config.d/00-hardening.conf.
# Include is at the top of sshd_config and the first value wins, so the name must sort before 50-cloud-init.conf.
PermitRootLogin no
PasswordAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
