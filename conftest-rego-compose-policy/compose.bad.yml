services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: hunter2
      POSTGRES_USER: app
    ports:
      - "5432:5432"
