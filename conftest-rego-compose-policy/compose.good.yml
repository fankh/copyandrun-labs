services:
  web:
    image: nginx:1.27-alpine
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:8080:80"
    tmpfs:
      - /var/cache/nginx
      - /var/run
  db:
    image: postgres:16-alpine
    user: "70:70"
    read_only: true
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: app
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /tmp
      - /var/run/postgresql
